  <script>

    document.addEventListener('DOMContentLoaded', async function () {
      const loading = document.getElementById('__bundler_loading');
      function setStatus(msg) { if (loading) loading.textContent = msg; }

      // Error sink persists across replaceWith since it's on window, not the DOM.
      window.addEventListener('error', function (e) {
        var p = document.body || document.documentElement;
        var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
        d.id = '__bundler_err';
        d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
        d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
          '[bundle] ' + (e.message || e.type) +
          (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
      }, true);

      try {
        const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
        const templateEl = document.querySelector('script[type="__bundler/template"]');
        if (!manifestEl || !templateEl) {
          setStatus('Error: missing bundle data');
          console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
          return;
        }

        const manifest = JSON.parse(manifestEl.textContent);
        let template = JSON.parse(templateEl.textContent);

        const uuids = Object.keys(manifest);
        setStatus('Unpacking ' + uuids.length + ' assets...');

        const blobUrls = {};
        await Promise.all(uuids.map(async (uuid) => {
          const entry = manifest[uuid];
          try {
            const binaryStr = atob(entry.data);
            const bytes = new Uint8Array(binaryStr.length);
            for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

            let finalBytes = bytes;
            if (entry.compressed) {
              if (typeof DecompressionStream !== 'undefined') {
                const ds = new DecompressionStream('gzip');
                const writer = ds.writable.getWriter();
                const reader = ds.readable.getReader();
                writer.write(bytes);
                writer.close();
                const chunks = [];
                let totalLen = 0;
                while (true) {
                  const { done, value } = await reader.read();
                  if (done) break;
                  chunks.push(value);
                  totalLen += value.length;
                }
                finalBytes = new Uint8Array(totalLen);
                let offset = 0;
                for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
              } else {
                console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
              }
            }

            blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
          } catch (err) {
            console.error('Failed to decode asset ' + uuid + ':', err);
            blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
          }
        }));

        const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
        const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
        const resourceMap = {};
        for (const entry of extResources) {
          if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
        }

        setStatus('Rendering...');
        for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

        // Strip integrity + crossorigin — blob URLs from a file:// document inherit
        // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
        // The manifest bytes are ours; SRI protects against CDN compromise, not this.
        template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

        const resourceScript = '<script>window.__resources = ' +
          JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
          ';</' + 'script>';
        // Inject after <head> so the DOCTYPE stays first; prepending the script
        // would push the parser into quirks mode. DOMParser always emits a <head>
        // (synthesizing one if the source HTML omitted it) but may carry
        // attributes through, so match the full opening tag. slice() rather than
        // replace() keeps us clear of $-pattern substitution in resourceScript.
        const headOpen = template.match(/<head[^>]*>/i);
        if (headOpen) {
          const i = headOpen.index + headOpen[0].length;
          template = template.slice(0, i) + resourceScript + template.slice(i);
        }

        // Parse the template and swap the root element. Scripts inserted via
        // DOMParser/replaceWith are inert per spec — re-create each with
        // createElement so they execute, awaiting onload for src scripts to
        // preserve ordering (React before ReactDOM before Babel before text/babel).
        const doc = new DOMParser().parseFromString(template, 'text/html');
        document.documentElement.replaceWith(doc.documentElement);
        const dead = Array.from(document.scripts);
        for (const old of dead) {
          const s = document.createElement('script');
          for (const a of old.attributes) s.setAttribute(a.name, a.value);
          s.textContent = old.textContent;
          // text/babel scripts with a src: fetch and inline. transformScriptTags
          // does XHR against the src, but blob:null/ from a file:// origin is
          // silently dropped. Inlining makes it a plain inline babel script,
          // which transformScriptTags handles unconditionally.
          if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
            const r = await fetch(s.src);
            s.textContent = await r.text();
            s.removeAttribute('src');
          }
          const p = s.src ? new Promise(function (r) { s.onload = s.onerror = r; }) : null;
          old.replaceWith(s);
          if (p) await p;
        }
        // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
        // which fired before we swapped the document. Trigger manually if present.
        if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
          window.Babel.transformScriptTags();
        }
      } catch (err) {
        setStatus('Error unpacking: ' + err.message);
        console.error('Bundle unpack error:', err);
      }
    });

  </script>

n  --hf-space-1: 4px;\n  --hf-space-2: 8px;\n  --hf-space-3: 12px;\n  --hf-space-4: 16px;\n  --hf-space-5: 20px;\n  --hf-space-6: 24px;\n  --hf-space-8: 32px;\n  --hf-space-10: 40px;\n  --hf-space-12: 48px;\n\n  /* ---------- Radii ---------- */\n  --hf-radius-xs: 4px;\n  --hf-radius-sm: 6px;\n  --hf-radius-md: 8px;    /* buttons, inputs */\n  --hf-radius-lg: 10px;   /* cards, modals */\n  --hf-radius-xl: 14px;\n  --hf-radius-pill: 999px;\n\n  /* ---------- Shadows ---------- */\n  --hf-shadow-xs:   0 1px 0 rgba(10,15,28,0.04);\n  --hf-shadow-sm:   0 1px 2px rgba(10,15,28,0.05), 0 1px 1px rgba(10,15,28,0.03);\n  --hf-shadow-md:   0 4px 10px rgba(10,15,28,0.06), 0 1px 2px rgba(10,15,28,0.04);\n  --hf-shadow-lg:   0 12px 28px rgba(10,15,28,0.10), 0 4px 8px rgba(10,15,28,0.05);\n  --hf-shadow-focus: 0 0 0 3px rgba(37,99,235,0.22);\n\n  /* ---------- Layout ---------- */\n  --hf-sidebar-w: 232px;\n  --hf-topbar-h:  56px;\n  --hf-max-content: 1480px;\n}\n\n/* ============================================================\n   Base element styles — semantic defaults\n   ============================================================ */\n\nhtml, body {\n  font-family: var(--hf-font-ui);\n  color: var(--hf-fg-1);\n  background: var(--hf-bg-app);\n  font-size: var(--hf-fs-md);\n  line-height: var(--hf-lh-body);\n  -webkit-font-smoothing: antialiased;\n  -moz-osx-font-smoothing: grayscale;\n}\n\nh1, h2, h3, h4 {\n  color: var(--hf-fg-1);\n  font-weight: 600;\n  letter-spacing: -0.01em;\n  line-height: var(--hf-lh-tight);\n  margin: 0;\n}\nh1 { font-size: var(--hf-fs-2xl); font-weight: 700; letter-spacing: -0.02em; }\nh2 { font-size: var(--hf-fs-xl); }\nh3 { font-size: var(--hf-fs-lg); }\nh4 { font-size: var(--hf-fs-md); }\n\np  { margin: 0; color: var(--hf-fg-2); }\nsmall { font-size: var(--hf-fs-xs); color: var(--hf-fg-3); }\ncode { font-family: var(--hf-font-mono); font-size: 0.92em; background: var(--hf-bg-subtle);\n       padding: 1px 5px; border-radius: var(--hf-radius-xs); }\n\na  { color: var(--hf-brand-blue); text-decoration: none; }\na:hover { text-decoration: underline; }\n\nhr { border: 0; border-top: 1px solid var(--hf-border-1); margin: var(--hf-space-6) 0; }\n\n/* Display face for the wordmark and any hero headline */\n.hf-display {\n  font-family: var(--hf-font-display);\n  font-weight: 700;\n  font-style: italic;\n  letter-spacing: -0.01em;\n  color: var(--hf-brand-ink);\n}\n\n/* The \"HiFred\" wordmark itself */\n.hf-wordmark {\n  font-family: var(--hf-font-display);\n  font-weight: 700;\n  font-style: italic;\n  letter-spacing: -0.02em;\n  color: var(--hf-brand-ink);\n  font-size: 26px;\n}\n.hf-wordmark .hi  { }\n.hf-wordmark .fred { }\n\n/* Focus ring — blue halo, matches active pill */\n:where(button, a, input, select, textarea):focus-visible {\n  outline: none;\n  box-shadow: var(--hf-shadow-focus);\n  border-radius: var(--hf-radius-md);\n}\n<\u002Fstyle>\n\n  <style>\n    :root {\n      --bg:        #000;\n      --ink:       #f1f1f3;\n      --ink-2:     #b5b6bd;\n      --ink-3:     #7c7d86;\n      --ink-4:     #4a4b54;\n      --line:      #1f2026;\n      --line-2:    #2c2d35;\n      --blue:      #4f8aff;\n      --blue-deep: #2563eb;\n\n      /* phase status dots */\n      --d-discovery:   #00d4d4;\n      --d-spec:        #eab308;\n      --d-engineering: #24c460;\n\n      /* team chip palette */\n      --t-marketing:   #f97316;\n      --t-qa:          #a855f7;\n      --t-support:     #06b6d4;\n      --t-sales:       #eab308;\n      --t-devops:      #ef4444;\n      --t-legal:       #c4a26a;\n      --t-management:  #9ca3af;\n      --t-release:     #22c55e;\n    }\n\n    *, *::before, *::after { box-sizing: border-box; }\n    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); }\n    body {\n      font-family: var(--hf-font-ui);\n      min-height: 100vh;\n      overflow-x: hidden;\n    }\n\n    /* ---------- workflow stage ---------- */\n    .stage {\n      position: relative;\n      width: 100%;\n      max-width: 1640px;\n      margin: 0 auto;\n      padding: 56px 36px 48px;\n      box-sizing: border-box;\n    }\n\n\n    /* ---------- the 3-column grid ---------- */\n    .grid {\n      position: relative;\n      display: grid;\n      grid-template-columns: 0.65fr 0.65fr 1.05fr;\n      column-gap: 32px;\n      align-items: stretch;   /* all three columns share the same row height */\n    }\n\n    /* ---------- shared card chrome ---------- */\n    .card {\n      position: relative;\n      background: linear-gradient(180deg, #0e0f13 0%, #0a0b0e 100%);\n      border: 1px solid var(--line);\n      border-radius: 12px;\n      padding: 12px 14px 14px 16px;\n      box-shadow: 0 12px 32px -16px rgba(0,0,0,0.6);\n      transition: border-color 320ms ease, box-shadow 320ms ease, transform 320ms ease;\n    }\n    .card::before {\n      content: \"\";\n      position: absolute;\n      left: 0; top: 12px; bottom: 12px;\n      width: 2px;\n      border-radius: 0 2px 2px 0;\n      background: var(--accent, var(--line-2));\n      opacity: 0.7;\n    }\n    .card .num {\n      position: absolute;\n      right: 12px; top: 12px;\n      font: 600 10px/1 var(--hf-font-mono);\n      letter-spacing: 0.18em;\n      color: var(--ink-4);\n    }\n\n    /* ----- LEFT column: phase cards (aligned, symmetrical) ----- */\n    .col-left {\n      display: flex;\n      flex-direction: column;\n      justify-content: space-between;\n      min-height: 480px;\n      padding-top: 4px;\n    }\n    .phase { --accent: var(--ink-4); width: calc(100% - 84px); align-self: flex-start; }\n    .phase.p-discovery   { --accent: var(--d-discovery);   margin-left: 36px; }\n    .phase.p-spec        { --accent: var(--d-spec); }\n    .phase.p-engineering { --accent: var(--d-engineering); margin-left: 84px; }\n\n    .phase .ph-head {\n      display: flex; align-items: center; gap: 10px;\n      margin-bottom: 8px;\n    }\n    .phase .ph-head .pdot {\n      width: 9px; height: 9px;\n      border-radius: 999px;\n      background: var(--accent);\n      box-shadow: 0 0 10px var(--accent);\n      flex: 0 0 auto;\n    }\n    .phase .ph-head .name {\n      font: 700 16px/1 var(--hf-font-mono);\n      letter-spacing: 0.04em;\n      color: var(--ink);\n    }\n    .phase .body {\n      font: 400 12px/1.5 var(--hf-font-mono);\n      color: var(--ink-2);\n    }\n    .phase .body .row { display: block; }\n    .phase .body .muted { color: var(--ink-4); }\n    .phase .body .key   { color: var(--ink-3); margin-right: 6px; }\n    .phase .body .blue  { color: var(--blue); }\n    .phase .body .ok    { color: var(--d-engineering); }\n    .phase .body .warn  { color: var(--d-spec); }\n    .phase .body .arrow { color: var(--ink-3); }\n    .phase .body p.title {\n      color: var(--ink);\n      font-weight: 600;\n      margin: 0 0 4px;\n    }\n    .phase .body .gap-top { margin-top: 8px; display: block; }\n    .phase .body .gap-mid { margin-top: 6px; display: block; }\n\n    /* ----- CENTER column: hiFred logo ----- */\n    .col-center {\n      align-self: stretch;\n      min-height: 480px;\n      display: flex;\n      flex-direction: column;\n      align-items: center;\n      justify-content: center;   /* logo lands at vertical middle of row → aligns with spec card */\n      padding: 0 12px;\n      position: relative;\n      z-index: 2;                /* logo sits on top of connection lines */\n    }\n    .hifred-logo {\n      position: relative;\n      z-index: 2;\n      width: 140px;\n      height: auto;\n      display: block;\n      user-select: none;\n    }\n\n    /* ----- RIGHT column: team cards (aligned, symmetrical) ----- */\n    .col-right {\n      display: flex;\n      flex-direction: column;\n      justify-content: space-between;\n      align-items: flex-start;   /* each card shrink-wraps its content */\n      min-height: 480px;\n      padding-top: 4px;\n      margin-left: 24px;     /* small rightward nudge */\n    }\n    .team {\n      --accent: var(--ink-4);\n      padding: 10px 14px 10px 16px;\n      display: flex;\n      align-items: center;\n      gap: 12px;\n    }\n    .team.t-marketing  { --accent: var(--t-marketing);  margin-left: -64px; }\n    .team.t-qa         { --accent: var(--t-qa);         margin-left: -40px; }\n    .team.t-support    { --accent: var(--t-support);    margin-left: -18px; }\n    .team.t-sales      { --accent: var(--t-sales); }\n    .team.t-devops     { --accent: var(--t-devops); }\n    .team.t-legal      { --accent: var(--t-legal);      margin-left: -18px; }\n    .team.t-management { --accent: var(--t-management); margin-left: -40px; }\n    .team.t-release    { --accent: var(--t-release);    margin-left: -64px; }\n\n    .team .chip {\n      flex: 0 0 auto;\n      padding: 3px 9px;\n      border-radius: 6px;\n      border: 1px solid color-mix(in oklab, var(--accent) 50%, transparent);\n      background: color-mix(in oklab, var(--accent) 12%, transparent);\n      color: var(--accent);\n      font: 700 10px/1.3 var(--hf-font-mono);\n      letter-spacing: 0.16em;\n      text-transform: uppercase;\n    }\n    .team .title {\n      flex: 0 1 auto;\n      font: 600 13px/1.3 var(--hf-font-mono);\n      color: var(--ink);\n      margin: 0;\n      white-space: nowrap;\n    }\n    .team .aside {\n      flex: 0 0 auto;\n      font: 400 11px/1.3 var(--hf-font-mono);\n      color: var(--ink-3);\n      letter-spacing: 0.02em;\n    }\n    .team .aside .blue { color: var(--blue); }\n\n    /* ---------- SVG connecting lines (static) ---------- */\n    .connections {\n      position: absolute;\n      inset: 0;\n      width: 100%;\n      height: 100%;\n      pointer-events: none;\n      overflow: visible;\n      z-index: 0;\n    }\n    .connections path {\n      fill: none;\n      stroke: rgba(79,138,255,0.42);\n      stroke-width: 1.25;\n      stroke-linecap: round;\n      filter: drop-shadow(0 0 4px rgba(79,138,255,0.35));\n    }\n    .connections path.to-left  { stroke: rgba(120,160,255,0.46); }\n    .connections path.to-right { stroke: rgba(79,138,255,0.40); }\n    .connections circle {\n      fill: rgba(79,138,255,0.85);\n    }\n\n\n\n    @media (max-width: 1100px) {\n      .grid {\n        grid-template-columns: 1fr;\n        gap: 24px;\n      }\n      .col-center { padding: 24px 0; order: -1; }\n      .connections { display: none; }\n    }\n  <\u002Fstyle>\n<\u002Fhead>\n<body>\n\n  \n\n  <section class=\"stage\">\n\n    <div class=\"grid\">\n\n      <!-- SVG connecting lines (drawn by JS to match real card positions) -->\n      <svg class=\"connections\" aria-hidden=\"true\"><\u002Fsvg>\n\n      <!-- LEFT: PHASES -->\n      <div class=\"col-left\">\n\n        <article class=\"card phase p-discovery\">\n          <span class=\"num\">01<\u002Fspan>\n          <div class=\"ph-head\">\n            <span class=\"pdot\"><\u002Fspan>\n            <span class=\"name\">Discovery<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"body\">\n            <span class=\"row\">· 14 user interviews<\u002Fspan>\n            <span class=\"row\">· 38 support tickets<\u002Fspan>\n            <span class=\"row\">· NPS responses (q2 + q3)<\u002Fspan>\n            <span class=\"gap-top arrow\">→ 3 themes identified<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Farticle>\n\n        <article class=\"card phase p-spec\">\n          <span class=\"num\">02<\u002Fspan>\n          <div class=\"ph-head\">\n            <span class=\"pdot\"><\u002Fspan>\n            <span class=\"name\">Spec<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"body\">\n            <p class=\"title\">Smart Notifications<\u002Fp>\n            <span class=\"row\"><span class=\"key\">AC1<\u002Fspan>Users can mute by category<\u002Fspan>\n            <span class=\"row\"><span class=\"key\">AC2<\u002Fspan>Quiet hours sync to calendar<\u002Fspan>\n            <span class=\"gap-top warn\">⚑ 2 gaps flagged before sprint<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Farticle>\n\n        <article class=\"card phase p-engineering\">\n          <span class=\"num\">03<\u002Fspan>\n          <div class=\"ph-head\">\n            <span class=\"pdot\"><\u002Fspan>\n            <span class=\"name\">Engineering<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"body\">\n            <span class=\"row\"><span class=\"key\">ENG<\u002Fspan>What if the user refreshes mid-flow?<\u002Fspan>\n            <span class=\"row gap-mid\"><span class=\"key blue\">FRED<\u002Fspan>Session persists 24h, then redirects.<\u002Fspan>\n            <span class=\"gap-top ok\">✓ <span style=\"color:var(--ink-2)\">0 open questions<\u002Fspan><\u002Fspan>\n          <\u002Fdiv>\n        <\u002Farticle>\n\n      <\u002Fdiv>\n\n      <!-- CENTER: hiFred logo -->\n      <div class=\"col-center\">\n        <img class=\"hifred-logo\" src=\"783143ed-cbe7-48a0-83b7-30c4bfd88fe3\" alt=\"hiFred\">\n      <\u002Fdiv>\n\n      <!-- RIGHT: TEAM OUTPUTS (compact one-liners) -->\n      <div class=\"col-right\">\n\n        <article class=\"card team t-marketing\">\n          <span class=\"chip\">Marketing<\u002Fspan>\n          <p class=\"title\">Feature brief — Smart Notifications<\u002Fp>\n        <\u002Farticle>\n\n        <article class=\"card team t-qa\">\n          <span class=\"chip\">QA<\u002Fspan>\n          <p class=\"title\">Test plan — Smart Notifications<\u002Fp>\n        <\u002Farticle>\n\n        <article class=\"card team t-support\">\n          <span class=\"chip\">Support<\u002Fspan>\n          <p class=\"title\">KB article — Tuning your notifications<\u002Fp>\n        <\u002Farticle>\n\n        <article class=\"card team t-sales\">\n          <span class=\"chip\">Sales<\u002Fspan>\n          <p class=\"title\">One-pager — What's new for renewals<\u002Fp>\n        <\u002Farticle>\n\n        <article class=\"card team t-devops\">\n          <span class=\"chip\">DevOps<\u002Fspan>\n          <p class=\"title\">Deploy plan — Smart Notifications<\u002Fp>\n          <span class=\"aside\">10% → 100%<\u002Fspan>\n        <\u002Farticle>\n\n        <article class=\"card team t-legal\">\n          <span class=\"chip\">Legal<\u002Fspan>\n          <p class=\"title\">Compliance review — retention scope<\u002Fp>\n          <span class=\"aside\">90d<\u002Fspan>\n        <\u002Farticle>\n\n        <article class=\"card team t-management\">\n          <span class=\"chip\">Management<\u002Fspan>\n          <p class=\"title\">Exec summary — Q3 feature update<\u002Fp>\n          <span class=\"aside\">Jun 14<\u002Fspan>\n        <\u002Farticle>\n\n        <article class=\"card team t-release\">\n          <span class=\"chip\">Release<\u002Fspan>\n          <p class=\"title\">What's new in v3.4<\u002Fp>\n          <span class=\"aside\">live<\u002Fspan>\n        <\u002Farticle>\n\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n\n  <\u002Fsection>\n\n  <script>\n    // Draw smooth flow-chart curves from the hiFred logo to every phase card\n    // (left) and every team card (right). Re-runs on load + resize so the\n    // wiring stays accurate at any viewport.\n    (function () {\n      const SVG_NS = 'http://www.w3.org/2000/svg';\n      const grid  = document.querySelector('.grid');\n      const svg   = document.querySelector('.connections');\n      const logo  = document.querySelector('.hifred-logo');\n      const lefts  = [...document.querySelectorAll('.col-left  .card')];\n      const rights = [...document.querySelectorAll('.col-right .card')];\n\n      function draw() {\n        if (!grid || !svg || !logo) return;\n        const g = grid.getBoundingClientRect();\n        const l = logo.getBoundingClientRect();\n        svg.setAttribute('viewBox', `0 0 ${g.width} ${g.height}`);\n        svg.setAttribute('width',  g.width);\n        svg.setAttribute('height', g.height);\n        svg.innerHTML = '';\n\n        // Logo anchor points: a touch inset from the logo edges so curves\n        // visibly meet the mark, not float off it.\n        const inset = Math.min(18, l.width * 0.08);\n        const logoY = (l.top + l.bottom) / 2 - g.top;\n        const leftAnchor  = { x: l.left  - g.left + inset, y: logoY };\n        const rightAnchor = { x: l.right - g.left - inset, y: logoY };\n\n        const makePath = (from, to, klass) => {\n          // Cubic bezier with control points pulled horizontally — classic\n          // flow-chart S-curve. Handle length scales with horizontal gap so\n          // close cards bend tightly and distant ones swoop gracefully.\n          const dx = Math.abs(to.x - from.x);\n          const handle = Math.max(40, dx * 0.55);\n          const c1x = from.x + Math.sign(to.x - from.x) * handle;\n          const c2x = to.x   - Math.sign(to.x - from.x) * handle;\n          const d = `M ${from.x.toFixed(1)} ${from.y.toFixed(1)} ` +\n                    `C ${c1x.toFixed(1)} ${from.y.toFixed(1)}, ` +\n                    `${c2x.toFixed(1)} ${to.y.toFixed(1)}, ` +\n                    `${to.x.toFixed(1)} ${to.y.toFixed(1)}`;\n          const p = document.createElementNS(SVG_NS, 'path');\n          p.setAttribute('d', d);\n          p.setAttribute('class', klass);\n          svg.appendChild(p);\n\n          // Small dot where the line meets the card — gives the curve a\n          // clear terminus instead of fading into the border.\n          const dot = document.createElementNS(SVG_NS, 'circle');\n          dot.setAttribute('cx', to.x.toFixed(1));\n          dot.setAttribute('cy', to.y.toFixed(1));\n          dot.setAttribute('r', '2');\n          svg.appendChild(dot);\n        };\n\n        lefts.forEach(card => {\n          const r = card.getBoundingClientRect();\n          const to = {\n            x: r.right - g.left,\n            y: (r.top + r.bottom) / 2 - g.top\n          };\n          makePath(leftAnchor, to, 'to-left');\n        });\n\n        rights.forEach(card => {\n          const r = card.getBoundingClientRect();\n          const to = {\n            x: r.left - g.left,\n            y: (r.top + r.bottom) / 2 - g.top\n          };\n          makePath(rightAnchor, to, 'to-right');\n        });\n      }\n\n      // Initial draw (after fonts/images settle), plus resize + image load.\n      const ready = () => requestAnimationFrame(draw);\n      if (document.readyState === 'complete') ready();\n      else window.addEventListener('load', ready);\n      window.addEventListener('resize', () => requestAnimationFrame(draw));\n      if (logo && !logo.complete) logo.addEventListener('load', ready);\n    })();\n  <\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
